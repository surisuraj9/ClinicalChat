[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicalchat"
version = "0.1.0"
description = "ClinicalChat — a simple role-aware multi-agent clinical chatbot (Lab, Radiology, Allergy, Care Coordinator)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "chromadb>=1.0",
  "networkx>=3.2",
  "pydantic>=2.6",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "pypdfium2>=4.0",
  "openpyxl>=3.1",
  "rapidocr-onnxruntime>=1.3",
  "gradio>=5.0",
  "python-dotenv>=1.0",
  "langfuse>=3.0",
]

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
clinicalchat = "clinicalchat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: calls a real LLM provider (deselect with -m 'not live')"]

[tool.setuptools.package-data]
clinicalchat = ["assets/*.svg"]
